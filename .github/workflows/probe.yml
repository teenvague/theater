name: Probe venue sites

# Diagnostic only. Asks each venue site the same question several ways and
# commits the answer, so a failure can be attributed rather than guessed at.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ask the venues
        run: python scripts/probe.py
      - name: Record the answer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json
          git diff --cached --quiet || git commit -m "Probe venue sites $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
