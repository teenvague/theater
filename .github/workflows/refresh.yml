name: Refresh listings and publish

# Weekly, not daily: theater runs change on the scale of weeks, and a lighter
# cadence is easier to justify to the sources we read.
on:
  schedule:
    # GitHub cron is UTC only. 12:00 and 13:00 Monday bracket 8 a.m. New York
    # across daylight saving; the gate drops whichever run is not 8 a.m. local.
    - cron: '0 12,13 * * 1'
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed snapshot back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Gate to 8 a.m. New York
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "08" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Not 8 a.m. in New York — this is the off-season half of the cron pair. Skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        if: steps.gate.outputs.go == 'true'
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Collect listings
        # A failing source keeps its last successful records; a total failure
        # leaves the published feed untouched. Fetching is gated on robots.txt.
        if: steps.gate.outputs.go == 'true'
        run: python scripts/refresh.py

      - name: Regression tests
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/model.test.js

      - name: Commit snapshot
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data data/source-health.json
          if [ -f data/image-health.json ]; then git add data/image-health.json; fi
          if [ -d dist/images ]; then git add -A dist/images; fi
          if git diff --cached --quiet; then
            echo "Listings unchanged; nothing to commit."
          else
            git commit -m "Refresh listings $(TZ=America/New_York date +'%Y-%m-%d')"
            git push
          fi

  deploy:
    needs: refresh
    # A bot commit does not retrigger workflows, so this job publishes the
    # snapshot itself rather than relying on publish.yml to notice the push.
    if: always() && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
